<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Loader dial QA</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #0b0b0c; color: #ece5d3; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .note { margin: 0 0 16px; color: #8d8271; }
  #frames { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
  figure { margin: 0; background: #141311; border: 1px solid #29241c; }
  iframe { display: block; width: 100%; height: 420px; border: 0; background: #0b0b0c; }
  figcaption { padding: 8px 10px; border-top: 1px solid #29241c; white-space: pre-wrap; font-size: 10.5px; line-height: 1.55; }
  .pass { color: #9fce8f; }
  .fail { color: #e08b7b; }
  #summary { margin-top: 16px; font-size: 13px; }
</style>
</head>
<body>
<h1>Loader dial QA</h1>
<p class="note">Staged <code>--load-p</code> states rendered from the real <code>index.html</code>. This page is inert and unlinked.</p>
<main id="frames"></main>
<p id="summary">running</p>
<script>
(function () {
  'use strict';
  var STAGES = [0, 0.25, 0.5, 0.75, 1];
  var rows = [];
  var done = 0;
  var host = document.getElementById('frames');
  var summary = document.getElementById('summary');

  function strokeOffset(el) {
    var v = (getComputedStyle(el).strokeDashoffset || '').replace(/\s/g, '');
    var n = parseFloat(v);
    if (isFinite(n)) return n;
    var m = v.match(/^calc\(([\d.]+)px\)$/);
    return m ? parseFloat(m[1]) : NaN;
  }

  function captionText(row) {
    var lines = [
      'p ' + row.p,
      'dial ' + row.dial,
      'ghost ' + row.ghost,
      'arc ' + row.arc + ' (want ' + row.expected + ')',
      'mask ' + row.maskOk + ' [' + row.maskDegs.join(', ') + ']',
      row.error ? 'error ' + row.error : (row.pass ? 'PASS' : 'FAIL')
    ];
    return lines.join('\n');
  }

  function finish() {
    done += 1;
    if (done < total) return;
    var pass = rows.filter(function (r) { return r.pass; }).length;
    summary.textContent = pass + '/' + rows.length + (pass === rows.length ? ' PASS' : ' FAIL');
    summary.className = pass === rows.length ? 'pass' : 'fail';
    window.__qaResult = { pass: pass, total: rows.length, rows: rows };
  }

  function readBase(d, p, row) {
    var dial = d.querySelector('.load-dial');
    row.dial = !!dial;
    var ghost = d.querySelector('.load-ghost');
    row.ghost = ghost ? getComputedStyle(ghost).opacity : null;
    var arc = d.querySelector('.load-arc');
    row.arc = arc ? strokeOffset(arc) : null;
    row.expected = Number((100 - 100 * p).toFixed(2));
    var reveal = d.querySelector('.load-reveal');
    var mask = '';
    if (reveal) {
      var cs = getComputedStyle(reveal);
      mask = cs.maskImage || cs.webkitMaskImage || cs.getPropertyValue('-webkit-mask-image') || '';
    }
    row.mask = mask;
    row.maskDegs = [];
    var m;
    var re = /([\d.]+)deg/g;
    while ((m = re.exec(mask))) row.maskDegs.push(parseFloat(m[1]));
    row.maskOk = p === 0 ? true : row.maskDegs.some(function (v) {
      return Math.abs(v - p * 360) <= 1;
    });
  }

  function setupLoading(d) {
    var gate = d.getElementById('entry-gate');
    if (gate) gate.setAttribute('hidden', '');
    var loading = d.getElementById('loading');
    if (loading) {
      loading.classList.remove('is-complete', 'is-hidden');
      loading.style.display = 'grid';
    }
    return loading;
  }

  function run(p, frame, cap, row, edge) {
    try {
      var d = frame.contentDocument;
      var loading = setupLoading(d);
      d.documentElement.style.setProperty('--load-p', String(p));

      if (edge === 'complete') {
        loading.classList.add('is-complete');
        setTimeout(function () {
          var cs = getComputedStyle(loading);
          row.ghost = cs.opacity;
          row.arc = null;
          row.maskOk = true;
          row.pass = loading.classList.contains('is-complete') && (cs.opacity === '0' || cs.visibility === 'hidden');
          row.error = row.pass ? '' : 'opacity=' + cs.opacity + ' visibility=' + cs.visibility;
          cap.textContent = captionText(row);
          cap.className = row.pass ? 'pass' : 'fail';
          finish();
        }, 1500);
        return;
      }

      if (edge === 'retry') {
        var retry = d.getElementById('retry-load');
        if (retry) retry.hidden = false;
        readBase(d, p, row);
        var retryVisible = retry ? !retry.hidden && (retry.offsetParent || retry.getBoundingClientRect().height > 0) : false;
        var status = d.getElementById('load-status');
        row.pass = row.dial && retryVisible && !!status && row.arc !== null && Math.abs(row.arc - row.expected) < 0.6;
        cap.textContent = captionText(row);
        cap.className = row.pass ? 'pass' : 'fail';
        finish();
        return;
      }

      if (edge === 'nomask') {
        var style = d.createElement('style');
        style.textContent = '.load-reveal{display:none !important}.load-ghost{opacity:1 !important}';
        (d.head || d.documentElement).appendChild(style);
        readBase(d, p, row);
        var ghost = d.querySelector('.load-ghost');
        var reveal = d.querySelector('.load-reveal');
        var gs = getComputedStyle(ghost);
        var rs = getComputedStyle(reveal);
        row.pass = row.dial && gs.opacity === '1' && rs.display === 'none' && row.arc !== null && Math.abs(row.arc - row.expected) < 0.6;
        row.maskOk = true;
        cap.textContent = captionText(row);
        cap.className = row.pass ? 'pass' : 'fail';
        finish();
        return;
      }

      readBase(d, p, row);
      row.pass = row.dial && row.arc !== null && Math.abs(row.arc - row.expected) < 0.6 && row.maskOk;
    } catch (err) {
      row.error = String((err && err.message) || err);
    }
    cap.textContent = captionText(row);
    cap.className = row.pass ? 'pass' : 'fail';
    finish();
  }

  var EDGES = [
    { p: 0.5, edge: 'complete', label: 'is-complete exit' },
    { p: 0.62, edge: 'retry', label: 'retry at 62%' },
    { p: 0.5, edge: 'nomask', label: 'no-mask fallback' }
  ];

  STAGES.forEach(function (p) {
    var row = { p: p, dial: false, ghost: null, arc: null, expected: null, mask: '', maskDegs: [], maskOk: false, pass: false, error: '' };
    rows.push(row);

    var figure = document.createElement('figure');
    var frame = document.createElement('iframe');
    frame.src = '../index.html';
    frame.title = 'loader at load-p ' + p;
    frame.loading = 'eager';
    var cap = document.createElement('figcaption');
    cap.textContent = 'p ' + p + ' loading';
    figure.appendChild(frame);
    figure.appendChild(cap);
    host.appendChild(figure);

    frame.addEventListener('load', function () {
      setTimeout(function () { run(p, frame, cap, row); }, 300);
    });
  });

  EDGES.forEach(function (e) {
    var row = { p: e.p, dial: false, ghost: null, arc: null, expected: null, mask: '', maskDegs: [], maskOk: false, pass: false, error: '' };
    rows.push(row);

    var figure = document.createElement('figure');
    var frame = document.createElement('iframe');
    frame.src = '../index.html';
    frame.title = 'loader edge: ' + e.label;
    frame.loading = 'eager';
    var cap = document.createElement('figcaption');
    cap.textContent = e.label + ' (p ' + e.p + ') loading';
    figure.appendChild(frame);
    figure.appendChild(cap);
    host.appendChild(figure);

    frame.addEventListener('load', function () {
      setTimeout(function () { run(e.p, frame, cap, row, e.edge); }, 300);
    });
  });

  var total = STAGES.length + EDGES.length;
})();
</script>
</body>
</html>
